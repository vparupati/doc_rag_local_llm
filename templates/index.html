<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.ui_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-brain me-2"></i>
                {{ settings.ui_title }}
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#" onclick="showStats()">
                    <i class="fas fa-chart-bar me-1"></i>
                    Stats
                </a>
                <a class="nav-link" href="#" onclick="resetVectorStore()">
                    <i class="fas fa-trash me-1"></i>
                    Reset
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Upload Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-upload me-2"></i>
                            Upload Documents
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="files" class="form-label">Select Files</label>
                                <input type="file" class="form-control" id="files" name="files" multiple 
                                       accept=".pdf,.txt,.md,.docx">
                                <div class="form-text">
                                    Supported formats: PDF, TXT, MD, DOCX (Max 10MB per file)
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary" id="uploadBtn">
                                <i class="fas fa-upload me-1"></i>
                                Upload Files
                            </button>
                        </form>
                        <div id="uploadProgress" class="mt-3" style="display: none;">
                            <div class="progress">
                                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                        <div id="uploadResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Query Section -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-question-circle me-2"></i>
                            Query Documents
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="queryForm">
                            <div class="mb-3">
                                <label for="question" class="form-label">Your Question</label>
                                <textarea class="form-control" id="question" name="question" rows="3" 
                                         placeholder="Ask a question about your uploaded documents..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-success" id="queryBtn">
                                <i class="fas fa-search me-1"></i>
                                Ask Question
                            </button>
                        </form>
                        <div id="queryResult" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- System Status -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="fas fa-info-circle me-2"></i>
                            System Status
                        </h6>
                    </div>
                    <div class="card-body">
                        <div id="systemStatus">
                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                            Checking system status...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="statsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">System Statistics</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="statsContent">
                    <div class="spinner-border" role="status"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
